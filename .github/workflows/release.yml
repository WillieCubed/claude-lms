name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Create the GitHub release with the built artifacts (tag pushes only).
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Bump the formula in WillieCubed/homebrew-tap (tag pushes only).
  # One-time setup: add the HOMEBREW_TAP_TOKEN secret (push access to the tap) and set
  # the repository variable HOMEBREW_BUMP=true. The formula must already exist in the tap.
  homebrew:
    needs: build
    if: ${{ vars.HOMEBREW_BUMP == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: claude-lms
          homebrew-tap: WillieCubed/homebrew-tap
          tag-name: ${{ github.ref_name }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
